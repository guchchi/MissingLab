name: missinglab
region: blr1
services:
  - name: web
    github:
      branch: main
      repo: guchchi/MissingLab
      deploy_on_push: true
    source_dir: /
    dockerfile_path: Dockerfile
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /
      initial_delay_seconds: 10
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
